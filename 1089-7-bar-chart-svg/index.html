<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 - Bar Chart SVG</title>
    <style type="text/css">
        .bar {
            fill: steelblue;
        }
        .bar:hover {
            fill: orange;
        }

    </style>
</head>
<body>
    <div id="chart-div">

    </div>
    <script type="module">
        import { BarChart} from './bar-chart-svg.js';
        const chart_div = document.getElementById('chart-div');
        const chart = new BarChart(chart_div);

        const data = [
            {label: 'January', value: 40},
            {label: 'February', value: 55},
            {label: 'March', value: 30},
            {label: 'April', value: 70},
            {label: 'May', value: 60}
        ];

        chart.draw(data);
    </script>
</body>
</html>

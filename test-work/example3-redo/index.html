<!--
a) Adaugati in codul HTML al paginii un element de tip <canvas> si un element de tip <audio>. Se va asigura afisarea interfetei pentru controlul fisierului audio disponibila implicit in browser.
b) Modificati aplicatia dezvoltata astfel incat doar la finalul rularii fisierului audio sa se afiseze in centrul canvas-ului un text la alegere.
c) Adaugati un buton care sa permita trecerea elementului audio in stare de rulare / pauza
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="canvas-container"></div>
    <audio id="audioElem" src="audio.mp3" controls></audio>
    <div id="btnPlay">Play</div>

    <script type="module">
        import { CanvasReporter} from './canvas-reporter.js';
        const canvasContainer = document.getElementById('canvas-container'); 
        const audioElem = document.getElementById('audioElem');
        const btnPlay = document.getElementById('btnPlay');
        const canvasReporter = new CanvasReporter()

        btnPlay.addEventListener('click', () => { 
            if (audio.paused) {
                audio.play();
                btnPlay.textContent = "Pause"; 
            } else { 
                audio.pause();
                btnPlay.textContent = "Play";
            }
        })

        audioElem.addEventListener('ended', () => { 
            canvasReporter.drawText(
                "final",
                "24px Impact",
                'red'
            )
        });

        canvasReporter.drawText('Asteptare', '16px Artial', 'gray' );
    </script>
    
</body>
</html>
